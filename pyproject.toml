[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-deck-optimizer"
version = "0.1.0"
description = "MTG Commander & Constructed Deck Ingestion, Normalization and Optimization Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "streamlit>=1.32.0",
    "pandas>=2.0.0",
    "pymongo>=4.6.0",
    "dnspython>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
